<!DOCTYPE html>
<html lang="hi">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial,sans-serif;background:#fff8ef;margin:0;padding:16px;color:#2b2118}
    .box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 3px 15px #0002}
    h1{font-size:25px;margin-top:0} label{display:block;margin-top:15px;font-weight:bold}
    input,select,textarea{width:100%;padding:12px;margin-top:6px;box-sizing:border-box;border:1px solid #ccc;border-radius:9px;font-size:16px}
    textarea{min-height:90px} button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#8b3f18;color:#fff;font-size:18px;font-weight:bold}
    #status{margin-top:15px;padding:12px;border-radius:8px;display:none}
  </style>
</head>
<body>
<div class="box">
<h1>📤 समरस मध्यप्रदेश</h1>
<p>संत रविदास महाराज 650वीं जयंती की समरसता यात्रा की फोटो/वीडियो भेजें।</p>
<form id="uploadForm">
<label>जिला</label>
<select name="district" required>
<option value="">जिला चुनें</option><option>भोपाल</option><option>बालाघाट</option>
<option>छिंदवाड़ा</option><option>नीमच</option><option>मंदसौर</option>
<option>रतलाम</option><option>इंदौर</option><option>उज्जैन</option><option>अन्य जिला</option>
</select>
<label>स्थान</label><input name="location" placeholder="गाँव / शहर / स्थान" required>
<label>कार्यक्रम की तारीख</label><input type="date" name="date" required>
<label>कार्यक्रम</label><input name="event" placeholder="जैसे — समरसता यात्रा / कलश यात्रा">
<label>अपलोडकर्ता का नाम</label><input name="uploader" placeholder="आपका नाम" required>
<label>मोबाइल नंबर</label><input name="contact" type="tel" placeholder="मोबाइल नंबर">
<label>फोटो / वीडियो</label><input name="file" type="file" accept="image/*,video/*" required>
<label>संक्षिप्त विवरण</label><textarea name="description" placeholder="यात्रा या कार्यक्रम के बारे में जानकारी"></textarea>
<button type="button" onclick="sendFile()">📤 सामग्री भेजें</button>
</form>
<div id="status"></div>
</div>
<script>
function sendFile(){
  const form=document.getElementById("uploadForm");
  const status=document.getElementById("status");
  const file=form.querySelector('input[name="file"]').files[0];
  if(!form.checkValidity()){form.reportValidity();return;}
  if(!file){status.style.display="block";status.innerHTML="❌ कृपया फोटो या वीडियो चुनें।";return;}
  if(file.size>20*1024*1024){status.style.display="block";status.innerHTML="❌ फाइल 20 MB से बड़ी है।";return;}
  status.style.display="block";status.innerHTML="⏳ सामग्री तैयार की जा रही है...";
  const reader=new FileReader();
  reader.onload=function(e){
    const data={
      district:form.district.value,location:form.location.value,date:form.date.value,
      event:form.event.value,uploader:form.uploader.value,contact:form.contact.value,
      description:form.description.value,fileName:file.name,mimeType:file.type,
      fileData:e.target.result.split(",")[1]
    };
    status.innerHTML="⏳ सामग्री Drive पर भेजी जा रही है...";
    google.script.run.withSuccessHandler(function(r){
      status.innerHTML="✅ "+r.message;form.reset();
    }).withFailureHandler(function(e){
      status.innerHTML="❌ त्रुटि: "+e.message;
    }).uploadMedia(data);
  };
  reader.onerror=function(){status.innerHTML="❌ फाइल पढ़ने में समस्या हुई।";};
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
